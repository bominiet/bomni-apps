<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>봄니 플래너</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="봄니 플래너">

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="https://bominiet.github.io/bomni-apps/planner/apple-touch-icon.png"
  >

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f3eb;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: #566052;
    }

    .box {
      text-align: center;
      padding: 30px;
    }

    img {
      width: 110px;
      height: 110px;
      border-radius: 24px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 10px;
    }

    p {
      font-size: 14px;
      line-height: 1.7;
      color: #8a8d85;
    }
  </style>
</head>

<body>

  <div class="box">
    <img src="./apple-touch-icon.png">
    <h1>봄니 플래너</h1>

    <p>
      Safari 공유 버튼에서<br>
      ‘홈 화면에 추가’를 눌러주세요 ♡
    </p>
  </div>

  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbxEky4y6BwyjECEVS-McO7aANy3-kGr1JIh2NO0SW7AzniRzOwrRUAohgUj02pHP58svg/exec";

    const isStandalone =
      window.navigator.standalone === true ||
      window.matchMedia('(display-mode: standalone)').matches;

    if (isStandalone) {
      window.location.replace(APP_URL);
    }
  </script>

</body>
</html>
